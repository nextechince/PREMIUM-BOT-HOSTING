<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌹 Premium Hosting Bot</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
        body {
            min-height:100vh;
            background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3e 50%,#0f3460 100%);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }
        .container {
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(30px);
            border-radius:40px;
            padding:50px 45px;
            max-width:440px;
            width:100%;
            border:1px solid rgba(255,255,255,0.08);
            box-shadow:0 40px 80px rgba(0,0,0,0.6);
            animation:slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from { opacity:0; transform:translateY(40px) scale(0.95); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }
        .logo { text-align:center; margin-bottom:35px; }
        .logo-icon { font-size:3.5em; display:block; margin-bottom:8px; animation:glow 3s ease-in-out infinite; }
        @keyframes glow { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
        .logo-text {
            font-size:1.6em; font-weight:800;
            background:linear-gradient(135deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            letter-spacing:1px;
        }
        .logo-sub { color:rgba(255,255,255,0.3); font-size:0.75em; margin-top:4px; letter-spacing:3px; text-transform:uppercase; }
        .input-group { margin-bottom:18px; }
        .input-group label { color:rgba(255,255,255,0.5); font-size:0.8em; display:block; margin-bottom:6px; font-weight:500; }
        .input-group input {
            width:100%; padding:14px 18px; border-radius:14px;
            border:2px solid rgba(255,255,255,0.06);
            background:rgba(255,255,255,0.04);
            color:#fff; font-size:1em; transition:all 0.3s; outline:none;
        }
        .input-group input:focus {
            border-color:#4d96ff;
            background:rgba(255,255,255,0.07);
            box-shadow:0 0 40px rgba(77,150,255,0.1);
        }
        .input-group input::placeholder { color:rgba(255,255,255,0.15); }
        .btn {
            width:100%; padding:16px; border:none; border-radius:14px;
            font-size:1em; font-weight:700; cursor:pointer; transition:all 0.3s;
            text-transform:uppercase; letter-spacing:1px;
        }
        .btn-primary {
            background:linear-gradient(135deg,#4d96ff,#6c5ce7);
            color:#fff; margin-top:8px;
        }
        .btn-primary:hover {
            transform:translateY(-2px);
            box-shadow:0 10px 40px rgba(77,150,255,0.3);
        }
        .btn-telegram {
            background:linear-gradient(135deg,#0088cc,#005f8b);
            color:#fff; display:flex; align-items:center; justify-content:center; gap:10px;
            text-decoration:none; margin-top:12px;
        }
        .btn-telegram:hover { transform:translateY(-2px); box-shadow:0 10px 40px rgba(0,136,204,0.3); }
        .divider { display:flex; align-items:center; margin:22px 0; }
        .divider::before, .divider::after {
            content:''; flex:1; height:1px;
            background:linear-gradient(to right,transparent,rgba(255,255,255,0.08),transparent);
        }
        .divider-text { color:rgba(255,255,255,0.15); font-size:0.7em; padding:0 15px; letter-spacing:2px; text-transform:uppercase; }
        .footer-text {
            text-align:center; color:rgba(255,255,255,0.12); font-size:0.65em; margin-top:20px; letter-spacing:1px;
        }
        .status-dot {
            display:inline-block; width:6px; height:6px; border-radius:50%;
            background:#6bcb77; animation:pulse 2s infinite; margin-right:6px;
        }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
        @media (max-width:480px) {
            .container { padding:30px 20px; }
            .logo-text { font-size:1.3em; }
            .logo-icon { font-size:2.8em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="logo-icon">🌹</span>
            <div class="logo-text">Pʀᴇᴍɪᴜᴍ Hᴏsᴛɪɴɢ Bᴏᴛ</div>
            <div class="logo-sub">⚡ Secure Login</div>
        </div>
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="input-group">
                <label>👤 Username</label>
                <input type="text" id="username" placeholder="Enter your username" required />
            </div>
            <div class="input-group">
                <label>🔒 Password</label>
                <input type="password" id="password" placeholder="Enter your password" required />
            </div>
            <button type="submit" class="btn btn-primary">🚀 Login</button>
        </form>
        <div class="divider"><span class="divider-text">or</span></div>
        <a href="https://t.me/PREMIUM_VPS_BOT_HOSTING_ROBOT" target="_blank" class="btn btn-telegram">📱 Login with Telegram</a>
        <div class="footer-text"><span class="status-dot"></span> Secure connection • 256-bit encryption</div>
    </div>
    <script>
        const USERS = {
            'admin': { password: 'admin123', userId: 1 },
            'demo': { password: 'demo123', userId: 1 }
        };
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const user = USERS[username];
            if (!user || user.password !== password) {
                alert('❌ Invalid username or password');
                return false;
            }
            localStorage.setItem('loggedInUser', JSON.stringify({ username, userId: user.userId }));
            window.location.href = `/dashboard/${user.userId}`;
            return false;
        }
    </script>
</body>
</html>
